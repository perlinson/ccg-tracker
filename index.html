<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎴 CCG游戏追踪器 - 即将上线的数字卡牌游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Motiva Sans", Arial, sans-serif;
            background: linear-gradient(180deg, #1b2838 0%, #171a21 100%);
            min-height: 100vh;
            color: #c7d5e0;
        }
        
        /* Header */
        header {
            background: linear-gradient(90deg, #171a21 0%, #2a475e 50%, #171a21 100%);
            padding: 40px 20px;
            text-align: center;
            border-bottom: 2px solid #66c0f4;
        }
        
        header h1 {
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 0 0 10px rgba(102, 192, 244, 0.5);
            margin-bottom: 10px;
        }
        
        header p {
            color: #8f98a0;
            font-size: 1.1rem;
        }
        
        /* Stats */
        .stats-bar {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            border-bottom: 1px solid #3d4852;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .stat-number {
            color: #66c0f4;
            font-size: 1.5rem;
            font-weight: bold;
        }
        
        .stat-label {
            color: #8f98a0;
            font-size: 0.9rem;
        }
        
        /* Filters */
        .filters {
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            background: rgba(0, 0, 0, 0.2);
        }
        
        .filter-btn {
            padding: 8px 20px;
            background: linear-gradient(to bottom, #3d6578 0%, #2c4756 100%);
            border: 1px solid #4c6b7f;
            color: #c7d5e0;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        
        .filter-btn:hover {
            background: linear-gradient(to bottom, #4a7a91 0%, #3d6578 100%);
            border-color: #66c0f4;
        }
        
        .filter-btn.active {
            background: linear-gradient(to bottom, #66c0f4 0%, #4a9fd4 100%);
            border-color: #66c0f4;
            color: #fff;
        }
        
        /* Games Grid */
        .games-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 30px;
        }
        
        /* Game Card - Steam Style */
        .game-card {
            background: linear-gradient(135deg, #2a3f54 0%, #1b2838 100%);
            border-radius: 4px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            border: 1px solid #3d4852;
        }
        
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(102, 192, 244, 0.2);
            border-color: #66c0f4;
        }
        
        .game-header {
            position: relative;
            height: 200px;
            overflow: hidden;
        }
        
        .game-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }
        
        .game-card:hover .game-cover {
            transform: scale(1.05);
        }
        
        .game-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 60px 15px 15px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
        }
        
        .game-title {
            font-size: 1.4rem;
            color: #fff;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .game-title-cn {
            color: #8f98a0;
            font-size: 0.95rem;
        }
        
        .status-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 12px;
            border-radius: 2px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        
        .status-released {
            background: linear-gradient(to bottom, #5c7e10 0%, #4a6b0c 100%);
            color: #a4d007;
        }
        
        .status-developing {
            background: linear-gradient(to bottom, #8a5628 0%, #6b4420 100%);
            color: #e89b36;
        }
        
        .status-announced {
            background: linear-gradient(to bottom, #2d5d7b 0%, #1e455c 100%);
            color: #66c0f4;
        }
        
        .game-info {
            padding: 15px;
        }
        
        .game-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }
        
        .meta-tag {
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 10px;
            border-radius: 2px;
            font-size: 0.8rem;
            color: #8f98a0;
        }
        
        .game-description {
            color: #8f98a0;
            font-size: 0.9rem;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            overflow-y: auto;
        }
        
        .modal.active {
            display: block;
        }
        
        .modal-content {
            max-width: 1000px;
            margin: 50px auto;
            background: #1b2838;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .modal-header {
            position: relative;
        }
        
        .modal-cover {
            width: 100%;
            height: 350px;
            object-fit: cover;
        }
        
        .modal-header-content {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(transparent, rgba(27, 40, 56, 0.95));
        }
        
        .modal-header h2 {
            font-size: 2rem;
            color: #fff;
            margin-bottom: 5px;
        }
        
        .modal-header p {
            color: #8f98a0;
            font-size: 1.1rem;
        }
        
        .close-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 2rem;
            color: #fff;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.5);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }
        
        .close-btn:hover {
            background: rgba(102, 192, 244, 0.5);
        }
        
        .modal-body {
            padding: 25px;
        }
        
        /* Info Grid */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .info-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 2px;
            border: 1px solid #3d4852;
        }
        
        .info-label {
            color: #8f98a0;
            font-size: 0.85rem;
            margin-bottom: 5px;
        }
        
        .info-value {
            color: #fff;
            font-size: 1rem;
        }
        
        /* Section Title */
        .section-title {
            font-size: 1.2rem;
            color: #fff;
            margin: 20px 0 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #3d4852;
        }
        
        /* Features */
        .features-list {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 25px;
        }
        
        .features-list li {
            background: rgba(102, 192, 244, 0.1);
            padding: 10px 15px;
            border-radius: 2px;
            color: #c7d5e0;
            font-size: 0.9rem;
            border-left: 3px solid #66c0f4;
        }
        
        /* Gallery */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .gallery-item {
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s;
            border: 1px solid #3d4852;
        }
        
        .gallery-item:hover {
            transform: scale(1.02);
            border-color: #66c0f4;
        }
        
        .gallery-image {
            width: 100%;
            aspect-ratio: 16/10;
            object-fit: cover;
            display: block;
        }
        
        .gallery-caption {
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            font-size: 0.85rem;
            color: #8f98a0;
        }
        
        /* Videos */
        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }
        
        .video-card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            display: block;
            border: 1px solid #3d4852;
            transition: all 0.3s;
        }
        
        .video-card:hover {
            border-color: #66c0f4;
            transform: translateY(-3px);
        }
        
        .video-thumbnail {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            background: #2a3f54;
        }
        
        .video-title {
            padding: 12px;
            font-size: 0.9rem;
            color: #c7d5e0;
        }
        
        /* Footer */
        footer {
            text-align: center;
            padding: 30px 20px;
            color: #566873;
            border-top: 1px solid #3d4852;
            margin-top: 40px;
        }
        
        @media (max-width: 768px) {
            .games-grid {
                grid-template-columns: 1fr;
            }
            
            header h1 {
                font-size: 1.8rem;
            }
            
            .stats-bar {
                gap: 20px;
            }
            
            .modal-cover {
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>🎴 CCG游戏追踪器</h1>
        <p>追踪近2年内将要上线的数字卡牌游戏 (CCG/TCG)</p>
    </header>
    
    <div class="stats-bar">
        <div class="stat-item">
            <span class="stat-number" id="totalGames">0</span>
            <span class="stat-label">款游戏</span>
        </div>
        <div class="stat-item">
            <span class="stat-number" id="totalImages">0</span>
            <span class="stat-label">张截图</span>
        </div>
        <div class="stat-item">
            <span class="stat-number" id="releasedCount">0</span>
            <span class="stat-label">已上线</span>
        </div>
        <div class="stat-item">
            <span class="stat-number" id="upcomingCount">0</span>
            <span class="stat-label">即将上线</span>
        </div>
    </div>
    
    <div class="filters">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="已上线">已上线</button>
        <button class="filter-btn" data-filter="开发中">开发中</button>
        <button class="filter-btn" data-filter="开发中">即将上线</button>
    </div>
    
    <div class="games-container">
        <div class="games-grid" id="gamesGrid"></div>
    </div>
    
    <footer>
        <p>🎴 CCG游戏追踪器 | 数据来源: Steam / YouTube / 官方公告</p>
        <p>最后更新: <span id="footerUpdate">-</span></p>
    </footer>
    
    <!-- Modal -->
    <div class="modal" id="gameModal">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div class="modal-content">
            <div class="modal-header">
                <img class="modal-cover" id="modalCover" src="" alt="游戏封面">
                <div class="modal-header-content">
                    <h2 id="modalTitle">游戏名称</h2>
                    <p id="modalTitleCn">游戏中文名</p>
                </div>
            </div>
            <div class="modal-body">
                <div class="info-grid">
                    <div class="info-item">
                        <div class="info-label">研发厂商</div>
                        <div class="info-value" id="modalDeveloper">-</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">预计上线</div>
                        <div class="info-value" id="modalRelease">-</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">状态</div>
                        <div class="info-value" id="modalStatus">-</div>
                    </div>
                </div>
                
                <h3 class="section-title">游戏介绍</h3>
                <p id="modalDescription" style="color: #8f98a0; line-height: 1.8; margin-bottom: 20px;"></p>
                
                <h3 class="section-title">游戏特色</h3>
                <ul class="features-list" id="modalFeatures"></ul>
                
                <div class="gallery-section" id="gallerySection">
                    <h3 class="section-title">游戏截图</h3>
                    <div class="gallery-grid" id="modalGallery"></div>
                </div>
                
                <div class="videos-section" id="videosSection">
                    <h3 class="section-title">相关视频</h3>
                    <div class="videos-grid" id="modalVideos"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="data.js"></script>
    <script>
        function renderGames(games) {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';
            
            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => openModal(game.id);
                
                const statusClass = getStatusClass(game.status);
                
                card.innerHTML = `
                    <div class="game-header">
                        <img class="game-cover" src="${game.coverImage}" 
                             alt="${game.name}" 
                             onerror="this.src='https://cdn.akamai.steamstatic.com/steam/apps/646570/header.jpg?t=1708611645'">
                        <div class="game-overlay">
                            <h3 class="game-title">${game.name}</h3>
                            <p class="game-title-cn">${game.nameCn}</p>
                        </div>
                        <span class="status-badge ${statusClass}">${game.status}</span>
                    </div>
                    <div class="game-info">
                        <div class="game-meta">
                            <span class="meta-tag">🏢 ${game.developer}</span>
                            <span class="meta-tag">📅 ${game.expectedRelease}</span>
                        </div>
                        <p class="game-description">${game.description}</p>
                    </div>
                `;
                
                grid.appendChild(card);
            });
            
            // Stats
            document.getElementById('totalGames').textContent = games.length;
            const totalImages = games.reduce((sum, g) => sum + (g.images?.length || 0), 0);
            document.getElementById('totalImages').textContent = totalImages;
            
            const released = games.filter(g => g.status === '已上线').length;
            const upcoming = games.length - released;
            document.getElementById('releasedCount').textContent = released;
            document.getElementById('upcomingCount').textContent = upcoming;
            
            document.getElementById('footerUpdate').textContent = new Date().toLocaleDateString('zh-CN');
        }
        
        function getStatusClass(status) {
            if (status === '已上线') return 'status-released';
            if (status === '开发中' || status === '即将上线') return 'status-developing';
            return 'status-announced';
        }
        
        function openModal(gameId) {
            const game = ccgGamesData.find(g => g.id === gameId);
            if (!game) return;
            
            document.getElementById('modalCover').src = game.coverImage;
            document.getElementById('modalCover').onerror = function() {
                this.src = 'https://cdn.akamai.steamstatic.com/steam/apps/646570/header.jpg?t=1708611645';
            };
            document.getElementById('modalTitle').textContent = game.name;
            document.getElementById('modalTitleCn').textContent = game.nameCn;
            document.getElementById('modalDeveloper').textContent = game.developer;
            document.getElementById('modalRelease').textContent = game.expectedRelease;
            document.getElementById('modalStatus').textContent = game.status;
            document.getElementById('modalDescription').textContent = game.description;
            
            // Features
            const featuresList = document.getElementById('modalFeatures');
            featuresList.innerHTML = '';
            game.features.forEach(feature => {
                const li = document.createElement('li');
                li.textContent = feature;
                featuresList.appendChild(li);
            });
            
            // Gallery
            const gallerySection = document.getElementById('gallerySection');
            const galleryGrid = document.getElementById('modalGallery');
            galleryGrid.innerHTML = '';
            
            if (game.images && game.images.length > 0) {
                gallerySection.style.display = 'block';
                game.images.forEach(img => {
                    const galleryItem = document.createElement('div');
                    galleryItem.className = 'gallery-item';
                    galleryItem.innerHTML = `
                        <img class="gallery-image" src="${img.url}" alt="${img.title}"
                             onerror="this.src='https://cdn.akamai.steamstatic.com/steam/apps/646570/ss_1.jpg'">
                        <div class="gallery-caption">${img.title}</div>
                    `;
                    galleryGrid.appendChild(galleryItem);
                });
            } else {
                gallerySection.style.display = 'none';
            }
            
            // Videos
            const videosSection = document.getElementById('videosSection');
            const videosGrid = document.getElementById('modalVideos');
            videosGrid.innerHTML = '';
            
            if (game.videos && game.videos.length > 0) {
                videosSection.style.display = 'block';
                game.videos.forEach(video => {
                    const videoCard = document.createElement('a');
                    videoCard.className = 'video-card';
                    videoCard.href = video.url;
                    videoCard.target = '_blank';
                    videoCard.innerHTML = `
                        <img class="video-thumbnail" src="https://img.youtube.com/vi/${getYouTubeId(video.url)}/mqdefault.jpg"
                             onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 9%22><rect fill=%22%232a3f54%22 width=%2216%22 height=%229%22/><text x=%228%22 y=%225%22 text-anchor=%22middle%22 fill=%22%2366c0f4%22 font-size=%221%22>▶ YouTube</text></svg>'">
                        <div class="video-title">${video.title}</div>
                    `;
                    videosGrid.appendChild(videoCard);
                });
            } else {
                videosSection.style.display = 'none';
            }
            
            document.getElementById('gameModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        
        function getYouTubeId(url) {
            const match = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
            return match ? match[1] : 'dQw4w9WgXcQ';
        }
        
        function closeModal() {
            document.getElementById('gameModal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }
        
        // Filter
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                const filter = btn.dataset.filter;
                if (filter === 'all') {
                    renderGames(ccgGamesData);
                } else {
                    const filtered = ccgGamesData.filter(g => g.status === filter);
                    renderGames(filtered);
                }
            });
        });
        
        // Close modal
        document.getElementById('gameModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('gameModal')) closeModal();
        });
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
        
        // Init
        renderGames(ccgGamesData);
    </script>
</body>
</html>

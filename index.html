<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎴 CCG游戏追踪 - 即将上线的数字卡牌游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        header p {
            color: #8892b0;
            font-size: 1.1rem;
        }
        
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .stat-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 25px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #00d2ff;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #8892b0;
        }
        
        .filters {
            padding: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .filter-btn {
            padding: 10px 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: transparent;
            color: #fff;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .filter-btn:hover, .filter-btn.active {
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            border-color: transparent;
        }
        
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            padding: 20px;
        }
        
        .game-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        
        .game-cover {
            width: 100%;
            height: 200px;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        .game-card:hover .game-cover {
            transform: scale(1.05);
        }
        
        .cover-container {
            overflow: hidden;
            position: relative;
        }
        
        .cover-container::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(transparent, rgba(26, 26, 46, 0.9));
        }
        
        .game-content {
            padding: 20px;
        }
        
        .game-title {
            font-size: 1.3rem;
            margin-bottom: 5px;
        }
        
        .game-title-cn {
            color: #8892b0;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }
        
        .game-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .meta-tag {
            background: rgba(0, 210, 255, 0.2);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
        }
        
        .game-description {
            color: #a0a0a0;
            font-size: 0.9rem;
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
            margin-bottom: 10px;
        }
        
        .status-developing {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
        }
        
        .status-announced {
            background: rgba(33, 150, 243, 0.2);
            color: #2196f3;
        }
        
        .status-released {
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
        }
        
        footer {
            text-align: center;
            padding: 30px;
            color: #8892b0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 40px;
        }
        
        /* Game Detail Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            overflow-y: auto;
        }
        
        .modal.active {
            display: block;
        }
        
        .modal-content {
            max-width: 1000px;
            margin: 50px auto;
            background: #1a1a2e;
            border-radius: 20px;
            overflow: hidden;
        }
        
        .modal-header {
            position: relative;
        }
        
        .modal-cover {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }
        
        .modal-header-content {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 30px;
            background: linear-gradient(transparent, rgba(26, 26, 46, 0.95));
        }
        
        .modal-header h2 {
            font-size: 2rem;
            margin-bottom: 5px;
        }
        
        .modal-header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }
        
        .modal-body {
            padding: 30px;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .info-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 10px;
        }
        
        .info-label {
            color: #8892b0;
            font-size: 0.85rem;
            margin-bottom: 5px;
        }
        
        .info-value {
            font-size: 1.1rem;
            color: #fff;
        }
        
        .section-title {
            font-size: 1.3rem;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .features-list {
            list-style: none;
            margin-bottom: 30px;
        }
        
        .features-list li {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .features-list li::before {
            content: "🎯";
        }
        
        .gallery-section {
            margin-bottom: 30px;
        }
        
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }
        
        .gallery-item {
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .gallery-item:hover {
            transform: scale(1.02);
        }
        
        .gallery-image {
            width: 100%;
            aspect-ratio: 16/10;
            object-fit: cover;
            display: block;
        }
        
        .gallery-caption {
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            font-size: 0.85rem;
            color: #ccc;
        }
        
        .videos-section {
            margin-bottom: 30px;
        }
        
        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }
        
        .video-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        
        .video-card:hover {
            transform: scale(1.02);
        }
        
        .video-thumbnail {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            background: #333;
        }
        
        .video-title {
            padding: 15px;
            font-size: 0.95rem;
        }
        
        .close-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 2rem;
            color: #fff;
            cursor: pointer;
            z-index: 1001;
            background: rgba(0, 0, 0, 0.5);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
        }
        
        .close-btn:hover {
            background: rgba(0, 0, 0, 0.8);
        }
        
        @media (max-width: 768px) {
            .games-grid {
                grid-template-columns: 1fr;
            }
            
            header h1 {
                font-size: 1.8rem;
            }
            
            .modal-content {
                margin: 0;
                border-radius: 0;
            }
            
            .modal-cover {
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>🎴 CCG游戏追踪器</h1>
        <p>追踪近2年内将要上线的数字卡牌游戏 (CCG/TCG)</p>
        <div class="stats">
            <div class="stat-item">
                <div class="stat-number" id="totalGames">0</div>
                <div class="stat-label">追踪游戏</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="totalImages">0</div>
                <div class="stat-label">游戏截图</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="totalVideos">0</div>
                <div class="stat-label">相关视频</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="lastUpdate">-</div>
                <div class="stat-label">最后更新</div>
            </div>
        </div>
    </header>
    
    <div class="filters">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="开发中">开发中</button>
        <button class="filter-btn" data-filter="官方宣布开发中">已宣布</button>
        <button class="filter-btn" data-filter="已上线，持续更新">已上线</button>
    </div>
    
    <div class="games-grid" id="gamesGrid">
        <!-- Games will be rendered here -->
    </div>
    
    <footer>
        <p>🎴 CCG游戏追踪器 | 数据来源: YouTube / 行业新闻 / 官方公告</p>
        <p>最后更新: <span id="footerUpdate">-</span></p>
    </footer>
    
    <!-- Game Detail Modal -->
    <div class="modal" id="gameModal">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div class="modal-content">
            <div class="modal-header">
                <img class="modal-cover" id="modalCover" src="" alt="游戏封面">
                <div class="modal-header-content">
                    <h2 id="modalTitle">游戏名称</h2>
                    <p id="modalTitleCn">游戏中文名</p>
                </div>
            </div>
            <div class="modal-body">
                <div class="info-grid">
                    <div class="info-item">
                        <div class="info-label">研发厂商</div>
                        <div class="info-value" id="modalDeveloper">-</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">预计上线</div>
                        <div class="info-value" id="modalRelease">-</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">状态</div>
                        <div class="info-value" id="modalStatus">-</div>
                    </div>
                </div>
                
                <h3 class="section-title">游戏介绍</h3>
                <p id="modalDescription" style="color: #a0a0a0; line-height: 1.8; margin-bottom: 30px;">
                </p>
                
                <h3 class="section-title">游戏特色</h3>
                <ul class="features-list" id="modalFeatures">
                </ul>
                
                <div class="gallery-section" id="gallerySection">
                    <h3 class="section-title">游戏截图</h3>
                    <div class="gallery-grid" id="modalGallery">
                    </div>
                </div>
                
                <div class="videos-section" id="videosSection">
                    <h3 class="section-title">相关视频</h3>
                    <div class="videos-grid" id="modalVideos">
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="data.js"></script>
    <script>
        // Render games
        function renderGames(games) {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';
            
            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => openModal(game.id);
                
                card.innerHTML = `
                    <div class="cover-container">
                        <img class="game-cover" src="${game.coverImage || 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=800&h=400&fit=crop'}" 
                             alt="${game.name}" 
                             onerror="this.src='https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=800&h=400&fit=crop'">
                    </div>
                    <div class="game-content">
                        <span class="status-badge ${getStatusClass(game.status)}">${game.status}</span>
                        <h3 class="game-title">${game.name}</h3>
                        <p class="game-title-cn">${game.nameCn}</p>
                        <div class="game-meta">
                            <span class="meta-tag">🏢 ${game.developer}</span>
                            <span class="meta-tag">📅 ${game.expectedRelease}</span>
                        </div>
                        <p class="game-description">${game.description}</p>
                    </div>
                `;
                
                grid.appendChild(card);
            });
            
            // Update stats
            document.getElementById('totalGames').textContent = games.length;
            const totalImages = games.reduce((sum, g) => sum + (g.images?.length || 0), 0);
            const totalVideos = games.reduce((sum, g) => sum + (g.videos?.length || 0), 0);
            document.getElementById('totalImages').textContent = totalImages;
            document.getElementById('totalVideos').textContent = totalVideos;
            document.getElementById('lastUpdate').textContent = new Date().toLocaleDateString('zh-CN');
            document.getElementById('footerUpdate').textContent = new Date().toLocaleDateString('zh-CN');
        }
        
        function getStatusClass(status) {
            if (status.includes('开发中') && !status.includes('已上线')) return 'status-developing';
            if (status.includes('已上线')) return 'status-released';
            return 'status-announced';
        }
        
        function openModal(gameId) {
            const game = ccgGamesData.find(g => g.id === gameId);
            if (!game) return;
            
            document.getElementById('modalCover').src = game.coverImage || 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=800&h=400&fit=crop';
            document.getElementById('modalTitle').textContent = game.name;
            document.getElementById('modalTitleCn').textContent = game.nameCn;
            document.getElementById('modalDeveloper').textContent = game.developer;
            document.getElementById('modalRelease').textContent = game.expectedRelease;
            document.getElementById('modalStatus').textContent = game.status;
            document.getElementById('modalDescription').textContent = game.description;
            
            // Features
            const featuresList = document.getElementById('modalFeatures');
            featuresList.innerHTML = '';
            game.features.forEach(feature => {
                const li = document.createElement('li');
                li.textContent = feature;
                featuresList.appendChild(li);
            });
            
            // Gallery
            const gallerySection = document.getElementById('gallerySection');
            const galleryGrid = document.getElementById('modalGallery');
            galleryGrid.innerHTML = '';
            
            if (game.images && game.images.length > 0) {
                gallerySection.style.display = 'block';
                game.images.forEach(img => {
                    const galleryItem = document.createElement('div');
                    galleryItem.className = 'gallery-item';
                    galleryItem.innerHTML = `
                        <img class="gallery-image" src="${img.url}" alt="${img.title}" 
                             onerror="this.src='https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=800&h=400&fit=crop'">
                        <div class="gallery-caption">${img.title}</div>
                    `;
                    galleryGrid.appendChild(galleryItem);
                });
            } else {
                gallerySection.style.display = 'none';
            }
            
            // Videos
            const videosSection = document.getElementById('videosSection');
            const videosGrid = document.getElementById('modalVideos');
            videosGrid.innerHTML = '';
            
            if (game.videos && game.videos.length > 0) {
                videosSection.style.display = 'block';
                game.videos.forEach(video => {
                    const videoCard = document.createElement('a');
                    videoCard.className = 'video-card';
                    videoCard.href = video.url;
                    videoCard.target = '_blank';
                    videoCard.innerHTML = `
                        <img class="video-thumbnail" src="https://img.youtube.com/vi/${getYouTubeId(video.url)}/mqdefault.jpg" 
                             alt="${video.title}"
                             onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 9%22><rect fill=%22%23333%22 width=%2216%22 height=%229%22/><text x=%228%22 y=%225%22 text-anchor=%22middle%22 fill=%22%23999%22 font-size=%221%22>▶ YouTube</text></svg>'">
                        <div class="video-title">${video.title}</div>
                    `;
                    videosGrid.appendChild(videoCard);
                });
            } else {
                videosSection.style.display = 'none';
            }
            
            document.getElementById('gameModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        
        function getYouTubeId(url) {
            const match = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
            return match ? match[1] : 'dQw4w9WgXcQ';
        }
        
        function closeModal() {
            document.getElementById('gameModal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }
        
        // Filter functionality
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                const filter = btn.dataset.filter;
                if (filter === 'all') {
                    renderGames(ccgGamesData);
                } else {
                    const filtered = ccgGamesData.filter(g => g.status.includes(filter));
                    renderGames(filtered);
                }
            });
        });
        
        // Close modal on backdrop click
        document.getElementById('gameModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('gameModal')) {
                closeModal();
            }
        });
        
        // Close modal on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
        
        // Initial render
        renderGames(ccgGamesData);
    </script>
</body>
</html>
